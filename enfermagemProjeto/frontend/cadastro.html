<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Enfermagem Cadastro</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/enfermagemProjeto/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div id="centralizarCadastro">

    <img id="imagemLogo" style="width: 160px;" src="/enfermagemProjeto/imagens/logoIFPR.png" alt="IFPR Londrina">



    <h2 id="cadastroDeAcesso">
      CADASTRO DE ACESSO
    </h2>


    <form action="/enfermagemProjeto/arquivosPHP/chamarFuncoes.php?acao=cadastro" method="post"
      style="width: 100%; max-width: 500px;">

      <div id="bordaDosInputs">

        <label class="form-label" for="email">E-mail</label>

        <input 
          type="email" 
          class="form-control" 
          style="margin-bottom:25px; height: 45px;" 
          name="email"
          id="email"
          placeholder="Digite seu email">
        <p class="erros"></p>

        <label class="form-label" for="senha">Senha</label>

        <input 
          type="password" 
          class="form-control" 
          style="margin-bottom:25px; height: 45px;" 
          name="senha"
          id="senha"
          placeholder="Digite sua senha">
          <p class="erros"></p>

        <label class="form-label">Nível de acesso</label>
        <input type="text" value="Aluno" name="tipo" readonly class="form-control"
          style="margin-bottom:25px; height:45px; background-color:#e9ecef; color:#6c757d; cursor:not-allowed; border:1px solid #ced4da;">


        <button id="submit-btn" class="btn btn-primary" type="submit">
          Criar conta
        </button>

        <a href="/enfermagemProjeto/frontend/login.html" id="linkRegistroELogin">Já tenho uma conta</a>
      </div>

    </form>

  </div>
  <script src="./js/formValidation.js"></script>

</body>

</html>
