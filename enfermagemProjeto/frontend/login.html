<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Enfermagem</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/enfermagemProjeto/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>

    <div id = "centralizarCadastro">

     <img id = "imagemLogo"  style="width: 160px;"
      src="/enfermagemProjeto/imagens/logoIFPR.png"
      alt="IFPR Londrina"
    >


   
      <h2 id = "cadastroDeAcesso" style =" text-align: center;">
        LOGIN DE ACESSO 
      </h2>

 
      <form action="/enfermagemProjeto/arquivosPHP/chamarFuncoes.php?acao=login" method="post" style="width: 100%; max-width: 500px;"id="usuario">

        <div  id = "bordaDosInputs">

          <label class="form-label" for="email">E-mail</label>

          <input
            id="email"
            type="email"
            class="form-control"
            style="margin-bottom:25px; height: 45px;"
            name="email"
            placeholder="Digite seu email"
            
          >
          <p class="erros"></p>
          <label class="form-label" for="senha">Senha</label>

          <input
            id="senha"
            type="password"
            class="form-control"
            style="margin-bottom:25px; height: 45px;"
            name="senha"
            placeholder="Digite sua senha"
            
          >

          <p class="erros"></p>

          <button id="submit-btn" class="btn btn-primary" type="submit">
            Entrar
          </button>

          <p>Não tem conta? <a href="/enfermagemProjeto/frontend/cadastro.html">Crie uma!</a></p>
        </div>

      </form>

    </div>
    <script src="./js/formValidation.js"></script>
  </body>
</html>
